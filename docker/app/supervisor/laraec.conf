[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:apache]
command=/usr/local/bin/apache2-foreground
directory=/var/www/html
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/apache.log
stderr_logfile=/var/log/supervisor/apache.err.log
stopasgroup=true
killasgroup=true

[program:schedule-worker]
command=php artisan schedule:work
directory=/var/www/html
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/schedule-worker.log
stderr_logfile=/var/log/supervisor/schedule-worker.err.log
stopasgroup=true
killasgroup=true

# numprocs はキュー処理量に応じて調整可能（現状は musashi-trade の実績値を踏襲）
[program:queue-worker]
command=php artisan queue:work --sleep=3 --tries=3 --timeout=900 --memory=512
directory=/var/www/html
autostart=true
autorestart=true
startsecs=5
numprocs=2
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/var/log/supervisor/queue-worker_%(process_num)02d.log
stderr_logfile=/var/log/supervisor/queue-worker_%(process_num)02d.err.log
stopasgroup=true
killasgroup=true

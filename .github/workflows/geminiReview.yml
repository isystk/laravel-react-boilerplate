name: gemini-code-review

on:
  pull_request:
    branches:
      - master
      - main
      - develop
    types:
      - opened
      - reopened

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    environment: GEMINI_API_KEY
    if: github.event.pull_request.draft == false
    timeout-minutes: 10

    steps:
      - name: プロジェクトのチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Base branch を取得
        run: git fetch origin ${{ github.base_ref }}

      - name: PR差分を取得
        run: |
          git diff \
            --unified=3 \
            origin/${{ github.base_ref }}...HEAD \
            -- . \
            ':(exclude)package-lock.json' \
            ':(exclude)yarn.lock' \
            ':(exclude)pnpm-lock.yaml' \
            ':(exclude)composer.lock' \
            ':(exclude)*.png' \
            ':(exclude)*.jpg' \
            ':(exclude)*.jpeg' \
            ':(exclude)*.gif' \
            ':(exclude)*.webp' \
            ':(exclude)*.svg' \
            ':(exclude)*.pdf' \
            ':(exclude)*.min.js' \
            ':(exclude)**/*.snap' \
            ':(exclude)**/generated/**' \
            ':(exclude)dist/**' \
            ':(exclude)build/**' \
            ':(exclude)coverage/**' \
            ':(exclude)node_modules/**' \
            ':(exclude).next/**' \
            > pr_diff.txt

          echo "Diff size: $(wc -c < pr_diff.txt) bytes"
          echo "Diff lines: $(wc -l < pr_diff.txt)"

      - name: 巨大PRをスキップ
        run: |
          DIFF_LINES=$(wc -l < pr_diff.txt)
          DIFF_BYTES=$(wc -c < pr_diff.txt)

          echo "Diff lines: $DIFF_LINES"
          echo "Diff bytes: $DIFF_BYTES"

          if [ "$DIFF_LINES" -gt 5000 ] || [ "$DIFF_BYTES" -gt 2000000 ]; then
            echo "PR diff too large. Skipping review."
            echo "SKIP_REVIEW=true" >> $GITHUB_ENV
          fi

      - name: Gemini APIでコードレビューを実施
        if: env.SKIP_REVIEW != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/gemini_review.py

      - name: review_result.json の存在確認
        run: |
          if [ ! -f review_result.json ]; then
            echo '{"skip": false, "skip_reason": null, "summary": "レビュー生成に失敗しました", "findings": []}' > review_result.json
          fi

      - name: レビュー未実施メッセージを生成
        if: env.SKIP_REVIEW == 'true'
        run: |
          cat <<'EOF' > review_result.json
          {
            "skip": true,
            "skip_reason": "PRの差分が大きすぎるため、自動レビューをスキップしました（上限: 5000 lines / 2MB）。PRを分割する・lock fileを除外する・機能単位でPRを分けるなどの対策を検討してください。",
            "summary": "",
            "findings": []
          }
          EOF

      - name: 既存のGeminiレビューコメントを削除
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.paginate(
              github.rest.pulls.listReviewComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              }
            );

            for (const comment of comments) {
              if (comment.body.includes('<!-- gemini-review -->')) {
                await github.rest.pulls.deleteReviewComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

      - name: PRにレビューコメントを投稿
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const result = JSON.parse(
              fs.readFileSync('review_result.json', 'utf8')
            );

            const marker = '<!-- gemini-review -->';

            const severityLabel = {
              Critical: '🔴 Critical',
              Warning: '🟡 Warning',
              Suggestion: '🟢 Suggestion',
            };

            const findings = result.findings || [];

            const comments = findings.map((f) => ({
              path: f.file,
              line: f.line,
              side: 'RIGHT',
              body: `${marker}\n**${severityLabel[f.severity] || f.severity}**\n\n${f.comment}`,
            }));

            const summaryText = result.skip
              ? `⚠️ ${result.skip_reason}`
              : `## 🤖 Gemini Code Review\n\n${result.summary || '特に問題は見つかりませんでした'}`;

            const footer = '---\n*このレビューは Gemini API によって自動生成されました*';

            const body = `${marker}\n${summaryText}\n\n${footer}`;

            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                commit_id: context.payload.pull_request.head.sha,
                event: 'COMMENT',
                body,
                comments,
              });
            } catch (error) {
              // インラインコメントの行番号がGitHub側で無効と判定された場合のフォールバック
              core.warning(
                `createReview failed with inline comments, retrying without them: ${error.message}`
              );

              const findingsList = findings
                .map((f) => `- [${f.severity}] ${f.file}:${f.line} ${f.comment}`)
                .join('\n');

              const fallbackBody = `${body}\n\n⚠️ インラインコメントの投稿に失敗したため、サマリーのみ表示しています。\n\n${findingsList}`;

              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                commit_id: context.payload.pull_request.head.sha,
                event: 'COMMENT',
                body: fallbackBody,
              });
            }

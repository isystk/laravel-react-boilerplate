name: unit-test

on:
  pull_request:
    branches:
      - 'master'
      - 'main'
      - 'develop'
    types:
      - opened
      - reopened
      - synchronize
      - edited
  workflow_dispatch:

jobs:
  unit-test:

    runs-on: ubuntu-latest

    steps:

      - name: プロジェクトのチェックアウト
        uses: actions/checkout@v4

      - name: 初期化
        run: |
          make init

      - name: Dockerの起動
        run: |
          make up

      - name: コンテナの準備完了を待機
        timeout-minutes: 10
        run: |
          until docker exec laraec-app test -f /tmp/entrypoint-done 2>/dev/null; do
            echo "Waiting for container setup to complete..."
            sleep 15
          done
          echo "Container is ready."

      - name: すべてのチェックを実行
        env:
          # Node.jsの場合
          NODE_OPTIONS: "--max-old-space-size=2048"
          # PHPの場合 (php.iniを上書き)
          PHP_OPTIONS: "-d memory_limit=2G"
        run: |
          make pre-commit
